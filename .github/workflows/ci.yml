name: CI - Docker Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker version

      - name: Build vulnerable application image
        run: |
          docker build \
            --tag vulnerable-web-app:${{ github.sha }} \
            .

      - name: Verify image was created
        run: docker image inspect vulnerable-web-app:${{ github.sha }}
