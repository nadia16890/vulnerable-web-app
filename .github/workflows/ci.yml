name: CI - DevSecOps

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-build:
    name: Security scans and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret scanning
      - name: Scan repository for secrets with Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Gitleaks result
        if: always()
        run: |
          echo "Gitleaks outcome: ${{ steps.gitleaks.outcome }}"

          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "::warning::Gitleaks detected possible secrets. Review the scan results."
          fi

      # SAST
      - name: Run Semgrep SAST scan
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config auto \
              --json \
              --output semgrep-results.json \
              .

      - name: Report Semgrep result
        if: always()
        run: |
          echo "Semgrep outcome: ${{ steps.semgrep.outcome }}"

          if [ "${{ steps.semgrep.outcome }}" = "failure" ]; then
            echo "::warning::Semgrep detected findings or encountered an execution problem."
          fi

          if [ -f semgrep-results.json ]; then
            echo "Semgrep result file generated successfully."
          else
            echo "::warning::Semgrep did not generate semgrep-results.json."
          fi

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 7

          # Software Composition Analysis
      - name: Install Node.js dependencies
        id: npm-install
        continue-on-error: true
        run: npm install

      - name: Audit Node.js dependencies
        id: npm-audit
        continue-on-error: true
        run: |
          npm audit \
            --json \
            > npm-audit-results.json

      - name: Report npm audit result
        if: always()
        run: |
          echo "npm install outcome: ${{ steps.npm-install.outcome }}"
          echo "npm audit outcome: ${{ steps.npm-audit.outcome }}"

          if [ "${{ steps.npm-audit.outcome }}" = "failure" ]; then
            echo "::warning::npm audit detected vulnerable dependencies or encountered an error."
          fi

          if [ -f npm-audit-results.json ]; then
            echo "npm audit report generated successfully."
          else
            echo "::warning::npm audit did not generate a report."
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          if-no-files-found: warn
          retention-days: 7

      # Docker build
      - name: Show Docker version
        run: docker version

      - name: Build vulnerable application image
        run: |
          docker build \
            --tag vulnerable-web-app:${{ github.sha }} \
            .

      # Container image vulnerability scanning
      - name: Scan Docker image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-web-app:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      - name: Report Trivy result
        if: always()
        run: |
          echo "Trivy outcome: ${{ steps.trivy.outcome }}"

          if [ "${{ steps.trivy.outcome }}" = "failure" ]; then
            echo "::warning::Trivy detected HIGH or CRITICAL vulnerabilities in the container image."
          fi

          if [ -f trivy-results.json ]; then
            echo "Trivy result file generated successfully."
          else
            echo "::warning::Trivy did not generate trivy-results.json."
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify image was created
        run: docker image inspect vulnerable-web-app:${{ github.sha }}